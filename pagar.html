<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DexCuba — Escrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1018; --panel:#101826; --panel2:#16202F; --line:#243247;
  --text:#EAF0F6; --muted:#8A99AD; --accent:#1FC7B6; --accent-deep:#0E9C8D;
  --flag-red:#D3273E; --up:#2EBD85; --down:#F6465D; --warn:#E8B341; --radius:14px;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:var(--text)}
select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;width:100%}
select option{background:#16202F;color:#EAF0F6}
select:focus{outline:none;border-color:var(--accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.topbar{display:flex;align-items:center;gap:20px;padding:0 24px;height:60px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,16,24,.92);backdrop-filter:blur(8px);z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;transition:opacity .15s}
.logo-mark{width:30px;height:30px;flex:none;display:block}
.logo-mark svg{width:100%;height:100%;display:block}
.logo:hover{opacity:.82}
.logo .cu{color:var(--accent)}
.net-badge{font-size:10.5px;font-weight:700;background:var(--warn);color:#2A1E00;padding:3px 8px;border-radius:6px;letter-spacing:.04em;white-space:nowrap}
.net-badge.mainnet{background:var(--up);color:#04231A}
.net-badge.wrong{background:var(--down);color:#fff}
.net-strip{background:repeating-linear-gradient(45deg,rgba(232,179,65,.13),rgba(232,179,65,.13) 10px,rgba(232,179,65,.06) 10px,rgba(232,179,65,.06) 20px);border-bottom:1px solid rgba(232,179,65,.35);color:var(--warn);text-align:center;padding:6px 16px;font-size:12px;font-weight:600;letter-spacing:.02em}
.net-strip.mainnet{background:rgba(246,70,93,.1);border-bottom-color:rgba(246,70,93,.35);color:var(--down)}
.net-strip.wrong{background:rgba(246,70,93,.12);border-bottom-color:rgba(246,70,93,.4);color:var(--down)}
.topnav{display:flex;gap:4px;margin-left:8px}
.topnav a{padding:8px 14px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500}
.topnav a:hover{color:var(--text);background:var(--panel2)}
.topnav a.active{color:var(--accent)}
.topbar-right{margin-left:auto}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.bal-pill{display:none;font-family:var(--mono);font-size:12.5px;color:var(--accent);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
.wallet-btn{padding:9px 18px;border-radius:10px;font-weight:700;font-size:13.5px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#05201C;transition:filter .12s}
.wallet-btn:hover{filter:brightness(1.08)}
.wallet-btn.on{background:var(--panel2);border:1px solid var(--accent);color:var(--accent);font-weight:600}

.wrap{max-width:940px;margin:0 auto;padding:26px 20px}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
@media(max-width:760px){.cards-grid{grid-template-columns:1fr}}
.setup{display:none;background:rgba(232,179,65,.1);border:1px solid rgba(232,179,65,.4);color:var(--warn);border-radius:12px;padding:13px 16px;margin-bottom:18px;font-size:13px}
.setup.show{display:block}
.setup code{font-family:var(--mono);color:var(--text)}

.offer-ctx{display:none;background:rgba(31,199,182,.08);border:1px solid rgba(31,199,182,.3);border-radius:12px;padding:13px 16px;margin-bottom:18px}
.offer-ctx.show{display:block}
.offer-ctx b{font-family:var(--display);font-size:14px}
.offer-ctx .oc-line{font-family:var(--mono);font-size:12.5px;color:var(--accent);margin:5px 0}
.offer-ctx .oc-help{font-size:12px;color:var(--muted);line-height:1.5}

.flow{display:flex;gap:8px;margin-bottom:20px;font-size:11.5px;color:var(--muted)}
.flow .step{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 8px;text-align:center;line-height:1.35}
.flow .step b{display:block;color:var(--text);font-size:12.5px;font-family:var(--display)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.card h2{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .role{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--accent);border:1px solid var(--line)}
.card .desc{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:var(--mono)}
.field input:focus{outline:none;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border-radius:11px;font-weight:600;font-size:14px;transition:filter .12s}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#05201C}
.btn-accent:hover{filter:brightness(1.08)}
.btn-accent:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-ghost{border:1px solid var(--line);background:var(--panel2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{border:1px solid rgba(246,70,93,.4);background:rgba(246,70,93,.08);color:var(--down)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.lookup{display:flex;gap:8px}
.lookup input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:var(--mono)}
.lookup input::placeholder{color:var(--muted)}
.lookup input:focus{outline:none;border-color:var(--accent)}
.card .lookup button{flex:none;width:auto;padding:0 20px}
.fee-preview{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:12px;line-height:1.5}
.fee-preview b{color:var(--accent)}
.card{margin-bottom:0}
.trade-view{display:none;margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px}
.trade-view.show{display:block}
.tv-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
.tv-row .k{color:var(--muted)}
.tv-row .v{font-family:var(--mono);word-break:break-all;text-align:right;max-width:70%}
.state-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.state-FUNDED{background:rgba(232,179,65,.14);color:var(--warn)}
.state-PAID{background:rgba(31,199,182,.14);color:var(--accent)}
.state-RELEASED{background:rgba(46,189,133,.14);color:var(--up)}
.state-REFUNDED{background:rgba(138,153,173,.14);color:var(--muted)}

.msg{display:none;text-align:center;font-size:13px;padding:10px;border-radius:10px;margin-top:12px}
.msg.show{display:block}
.msg.err{background:rgba(246,70,93,.12);color:var(--down)}
.msg.ok{background:rgba(46,189,133,.12);color:var(--up)}
.msg.info{background:var(--panel2);color:var(--muted)}

.safety{background:rgba(232,179,65,.07);border:1px solid rgba(232,179,65,.25);border-radius:12px;padding:12px 15px;margin-top:8px;font-size:12px;color:var(--muted);line-height:1.6}
.safety b{color:var(--warn)}
.foot{max-width:940px;margin:0 auto;padding:14px 20px 34px;color:var(--muted);font-size:11.5px;text-align:center}
@media(max-width:860px){
  .flow{flex-wrap:wrap;gap:6px}
  .flow .step{flex:1 1 calc(50% - 3px);font-size:10.5px;padding:8px 6px}
  .flow .step b{font-size:11.5px}
  .lookup{flex-direction:column}
  .lookup button{width:100%}
  .cards-grid{gap:14px}
}
@media(max-width:520px){.two,.btn-row{grid-template-columns:1fr}}
</style>
<meta property="og:title" content="DexCuba">
<meta property="og:description" content="Mercado P2P de USDT por CUP con escrow. Sin custodia.">
<meta property="og:image" content="/icon-512.png">
<meta property="og:url" content="https://dexcuba.com">
<meta property="og:type" content="website">
<meta name="application-name" content="DexCuba">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DexCuba">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/mobile.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="/" aria-label="DexCuba — ir al inicio"><span class="logo-mark"><svg viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" rx="26" fill="#D3273E"/><circle cx="60" cy="60" r="42" fill="none" stroke="#fff" stroke-width="4" opacity=".35"/><path d="M60 24 L70 50 L98 50 L75 66 L84 93 L60 76 L36 93 L45 66 L22 50 L50 50 Z" fill="#fff"/><circle cx="60" cy="60" r="9" fill="#1FC7B6"/></svg></span>Dex<span class="cu">Cuba</span> <span class="net-badge" id="netBadge">NILE · PRUEBAS</span></a>
  <nav class="topnav">
    <a href="/" data-short="Inicio">Panel</a>
    <a href="/convertir.html" data-short="Convertir">Convertir</a>
    <a href="/cobrar.html" class="active" data-short="Cobrar">Cobrar</a>
    <a href="/p2p.html" data-short="P2P">Mercado P2P</a>
    <a href="/cuenta.html" data-short="Cuenta">Mi cuenta</a>
    <a href="/escrow.html" data-short="Escrow">Escrow</a>
  </nav>
  <div class="topbar-right">
    <span class="bal-pill" id="balPill"></span>
    <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">Conectar wallet</button>
  </div>
</header>

<div class="net-strip" id="netStrip"></div>

<div class="wrap">
  <div style="max-width:480px;margin:0 auto" id="payBox">
    <div class="card" style="text-align:center;padding:26px 22px">
      <div id="loading" style="color:var(--muted);font-size:13px">Cargando el cobro…</div>

      <div id="payContent" style="display:none">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px" id="pWho"></div>
        <div style="font-family:var(--display);font-size:34px;font-weight:700;color:var(--accent)" id="pAmount"></div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px" id="pCup"></div>
        <div id="pConcept" style="font-size:14px;margin:10px 0;padding:10px 14px;background:var(--panel2);border-radius:10px;display:none"></div>
        <span class="net-badge" id="pNet" style="display:inline-block;margin-bottom:14px"></span>

        <div id="qrWrap" style="background:#fff;border-radius:14px;padding:14px;display:inline-block;margin-bottom:8px"><div id="qr"></div></div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:14px" id="pAddr"></div>

        <button class="btn btn-accent" id="btnPay" onclick="pay()">Pagar con mi wallet</button>
        <button class="btn btn-ghost" style="margin-top:8px" onclick="copyAddr()">Copiar dirección</button>
        <div class="msg" id="msg"></div>
        <p style="font-size:11.5px;color:var(--muted);margin-top:12px">El pago va directo a la wallet del cobrador.
        DexCuba no interviene ni cobra por esto.</p>
      </div>

      <div id="paidBanner" style="display:none">
        <div style="font-size:44px;margin-bottom:8px">✅</div>
        <div style="font-family:var(--display);font-size:20px;font-weight:700;color:var(--up);margin-bottom:6px">PAGADO</div>
        <div style="font-size:13px;color:var(--muted)" id="paidInfo"></div>
        <a id="paidTx" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent)">Ver transacción</a>
      </div>

      <div id="errBanner" style="display:none;color:var(--down);font-size:14px"></div>
    </div>
  </div>
</div>

<footer class="foot">DexCuba · pagos wallet a wallet, sin custodia.</footer>

<script src="/config.js"></script>
<script src="/wallet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script>
const CFG=window.DEXCUBA;
const $=id=>document.getElementById(id);
function showMsg(t,c){const m=$('msg');m.innerHTML=t;m.className='msg show '+(c||'info');}
let PAY=null;
async function connectWallet(){
  let got=null;
  if(window.DexWallet){try{const w=await DexWallet.connect();if(w)got=w.address;}catch(e){}}
  if(!got&&window.ethereum){try{const a=await window.ethereum.request({method:'eth_requestAccounts'});if(a&&a[0])got=a[0];}catch(e){}}
  const b=$('walletBtn');
  if(got&&b){b.textContent=got.slice(0,6)+'…'+got.slice(-4);b.classList.add('on');}
  if(!got)showMsg('No se detectó ninguna wallet. También puedes copiar la dirección y pagar desde donde prefieras.','err');
  return got;
}


async function load(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){fail('Enlace incompleto: falta el identificador del cobro.');return;}
  try{
    const r=await fetch('/api/pay?id='+encodeURIComponent(id));
    const d=await r.json();
    if(!r.ok||d.error){fail(d.error==='no_encontrado_o_caducado'?'Este cobro no existe o caducó (los enlaces duran 30 días).':'No se pudo cargar el cobro.');return;}
    PAY=d.pay;render();
  }catch(e){fail('Error de red al cargar el cobro.');}
}
function fail(t){$('loading').style.display='none';$('errBanner').style.display='block';$('errBanner').textContent=t;}
function render(){
  $('loading').style.display='none';
  if(PAY.status==='pagado'){renderPaid();return;}
  $('payContent').style.display='block';
  let who=PAY.alias?('Cobro de '+PAY.alias):'Solicitud de pago';
  if(PAY.vip)who+=' <span style="background:linear-gradient(135deg,#F0C24B,#C99A2E);color:#241a00;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;vertical-align:middle">⭐ VIP</span>';
  if(PAY.rating)who+=' <span style="color:#F0C24B;font-size:11px">'+PAY.rating.toFixed(1)+'★</span>';
  $('pWho').innerHTML=who;
  $('pAmount').textContent=PAY.amount+' USDT';
  $('pNet').textContent=PAY.network==='TRC20'?'TRC-20 · TRON':'BEP-20 · BNB Chain';
  $('pNet').style.background=PAY.network==='TRC20'?'rgba(31,199,182,.15)':'rgba(240,185,11,.15)';
  $('pNet').style.color=PAY.network==='TRC20'?'var(--accent)':'#F0B90B';
  if(PAY.concept){$('pConcept').textContent=PAY.concept;$('pConcept').style.display='block';}
  $('pAddr').textContent=PAY.to;
  new QRCode($('qr'),{text:PAY.to,width:168,height:168,correctLevel:QRCode.CorrectLevel.M});
  fetch('/api/cup').then(r=>r.json()).then(d=>{
    if(d&&d.rates&&d.rates.USDT)$('pCup').textContent='≈ '+Math.round(PAY.amount*d.rates.USDT).toLocaleString('es-ES')+' CUP · tasa cripto elTOQUE';
  }).catch(()=>{});
}
function renderPaid(){
  $('payContent').style.display='none';
  $('paidBanner').style.display='block';
  $('paidInfo').textContent=PAY.amount+' USDT ('+(PAY.network==='TRC20'?'TRC-20':'BEP-20')+') · verificado en la cadena';
  const ex=PAY.network==='TRC20'?CFG.net.explorer+'/#/transaction/'+PAY.txid:CFG.evm.explorer+'/tx/'+PAY.txid;
  $('paidTx').href=ex;
}
function copyAddr(){
  (navigator.clipboard?navigator.clipboard.writeText(PAY.to):Promise.reject())
    .then(()=>showMsg('Dirección copiada. Puedes pagar desde cualquier wallet.','ok')).catch(()=>{});
}

/* ===== Pago directo desde la wallet ===== */
async function pay(){
  if(!PAY)return;
  if(PAY.network==='TRC20')return payTron();
  return payBsc();
}
async function payTron(){
  const w=window.DexWallet?await DexWallet.connect():null;
  if(!w){showMsg('Abre este enlace desde el navegador de tu wallet TRON (TronLink, TokenPocket…) o copia la dirección y paga a mano.','err');return;}
  try{
    showMsg('Firma el pago en tu wallet…','info');
    const usdt=CFG.net.usdt;
    const c=await w.tronWeb.contract([
      {"constant":false,"inputs":[{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
    ],usdt);
    const units=String(Math.round(PAY.amount*1e6));
    const txid=await c.transfer(PAY.to,units).send({feeLimit:150000000});
    await confirmPaid(txid);
  }catch(e){showMsg('✗ '+((e&&e.message)||e),'err');}
}
async function payBsc(){
  const eth=window.ethereum&&(window.ethereum.providers?window.ethereum.providers[0]:window.ethereum);
  if(!eth){showMsg('Abre este enlace desde una wallet EVM (MetaMask, Trust, Bitget…) o copia la dirección y paga a mano.','err');return;}
  try{
    await eth.request({method:'eth_requestAccounts'});
    try{await eth.request({method:'wallet_switchEthereumChain',params:[{chainId:CFG.evm.chainIdHex}]});}catch(e){}
    const provider=new ethers.providers.Web3Provider(eth,'any');
    const signer=provider.getSigner();
    const usdt=new ethers.Contract(CFG.evm.usdt,['function transfer(address,uint256) returns (bool)'],signer);
    showMsg('Firma el pago en tu wallet…','info');
    const tx=await usdt.transfer(PAY.to,ethers.utils.parseUnits(String(PAY.amount),CFG.evm.usdtDecimals));
    showMsg('Esperando confirmación…','info');
    await tx.wait();
    await confirmPaid(tx.hash);
  }catch(e){showMsg('✗ '+((e&&(e.reason||e.message))||e),'err');}
}
async function confirmPaid(txid){
  showMsg('Pago enviado. Verificando en la cadena…','info');
  for(let i=0;i<15;i++){
    await new Promise(r=>setTimeout(r,4000));
    try{
      const r=await fetch('/api/pay',{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:PAY.id,txid})});
      const d=await r.json();
      if(d.ok&&d.pay&&d.pay.status==='pagado'){PAY=d.pay;renderPaid();return;}
    }catch(e){}
    showMsg('Verificando… ('+((i+1)*4)+'s)','info');
  }
  showMsg('El pago se envió pero la verificación tarda. El cobrador lo verá al llegar. Hash: <span style="font-family:var(--mono);font-size:11px">'+txid+'</span>','ok');
}

CFG.paintNetworkUI(null);
load();
</script>
<script src="/nav.js"></script>
</body>
</html>
